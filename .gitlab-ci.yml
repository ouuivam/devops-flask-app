stages:
  - build
  - deploy

variables:
  IMAGE_NAME: "uiaam/swap-flask-app"
  IMAGE_TAG: "latest"
  DOCKER_DRIVER: overlay2

build:
  stage: build
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
      command: ["--tls=false"]
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "Login Docker"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin
    - echo "Build Docker image"
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -f swap-app/Dockerfile swap-app
    - echo "Push Docker image"
    - docker push $IMAGE_NAME:$IMAGE_TAG
  only:
    - main

deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  needs: [build]
  script:
    - powershell -Command "[System.IO.File]::WriteAllBytes('kubeconfig', [System.Convert]::FromBase64String('$env:KUBECONFIG_CONTENT'))"
    - set KUBECONFIG=%CD%\kubeconfig
    - kubectl apply -f kubernetes/deployment.yaml
    - kubectl apply -f kubernetes/service.yaml
  only:
    - main