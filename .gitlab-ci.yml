stages:
  - build
  - test
  - deploy

variables:
  IMAGE_NAME: "uiaam/swap-flask-app"
  IMAGE_TAG: "latest"
  DOCKER_DRIVER: overlay2

build:
  stage: build
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
      command: ["--tls=false"]
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "Waiting for Docker daemon..."
    - until docker info >/dev/null 2>&1; do sleep 2; done
    - echo "Logging in to Docker Hub"
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin
    - echo "Build Docker image"
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -f swap-app/Dockerfile swap-app
    - echo "Push Docker image"
    - docker push $IMAGE_NAME:$IMAGE_TAG
  only:
    - main

test:
  stage: test
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin
    - apk add --no-cache curl
  script:
    - echo "Start container..."
    - docker run -d -p 5000:5000 --name test_container $IMAGE_NAME:$IMAGE_TAG
    - sleep 5
    - echo "Test API from container..."
    - docker exec test_container curl -f http://localhost:5000 || exit 1
    - docker stop test_container
    - docker rm test_container
  only:
    - main

deploy:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  needs: [build, test]
  script:
    - echo "Setup kubeconfig"
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_CONTENT" > ~/.kube/config
    - export KUBECONFIG=~/.kube/config

    - echo "Test cluster connection"
    - kubectl get nodes

    - echo "Deploy app"
    - kubectl apply -f kubernetes/deployment.yaml
    - kubectl apply -f kubernetes/service.yaml
    - kubectl rollout restart deployment swap-flask-app
  only:
    - main